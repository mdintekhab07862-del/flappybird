<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#4fb3e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>फ्लैपी बर्ड</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#6ec6ea;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,"Noto Sans Devanagari",sans-serif}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block}
#msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none}
#msg h1{font-size:2.3rem;margin:0 0 .4rem}
#msg p{font-size:1.1rem;margin:.25rem 0}
#msg .card{display:inline-block;background:rgba(20,40,60,.7);border-radius:14px;padding:.8rem 1.6rem;margin:.5rem 0;text-shadow:none}
#snd{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));font-size:1.5rem;background:rgba(0,0,0,.25);border:0;border-radius:50%;width:44px;height:44px;color:#fff}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="snd" aria-label="आवाज़">🔊</button>
</div>
<script>
const W=320,H=480,GH=64,c=document.getElementById('c'),x=c.getContext('2d'),msg=document.getElementById('msg'),snd=document.getElementById('snd');
let best=0,muted=false,ac=null;
try{best=+localStorage.getItem('fb2_best')||0;muted=localStorage.getItem('fb2_mute')==='1'}catch(e){}
snd.textContent=muted?'🔇':'🔊';
function fit(){const d=Math.min(devicePixelRatio||1,3),s=Math.min(innerWidth/W,innerHeight/H);
  c.style.width=W*s+'px';c.style.height=H*s+'px';c.width=W*s*d;c.height=H*s*d;x.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',fit);fit();

function beep(f,d,t,f2){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,ac.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);
  g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

let bird,pipes,clouds,score,state,gx,shake,overAt,t=0,last=performance.now();
clouds=[...Array(5)].map((_,i)=>({x:i*70,y:40+Math.random()*160,s:.6+Math.random()*.8}));
function reset(){bird={y:220,v:0,rot:0};pipes=[];score=0;gx=0;shake=0;state='ready';show()}
function medal(){return score>=30?'🥇 सोना':score>=20?'🥈 चांदी':score>=10?'🥉 कांस्य':''}
function show(){
  if(state==='ready')msg.innerHTML='<h1>फ्लैपी बर्ड</h1><p>उड़ने के लिए टैप करें</p>'+(best?'<p>सबसे अच्छा: '+best+'</p>':'');
  else if(state==='over')msg.innerHTML='<h1>गेम ओवर</h1><div class="card"><p>स्कोर: <b>'+score+'</b></p><p>सबसे अच्छा: <b>'+best+'</b></p>'+(medal()?'<p>'+medal()+'</p>':'')+'</div><p>दोबारा खेलने के लिए टैप करें</p>';
  else msg.innerHTML=''}
function flap(){
  if(state==='over'){if(performance.now()-overAt>600)reset();return}
  if(state==='ready'){state='play';show()}
  bird.v=-6;beep(520,.12,'square',820)}
function die(){
  state='over';overAt=performance.now();shake=10;beep(220,.35,'sawtooth',60);
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  if(score>best){best=score;try{localStorage.setItem('fb2_best',best)}catch(e){}}show()}

function update(dt){
  const sp=2+Math.min(score*.04,1.3),gap=Math.max(98,128-score*.9);
  clouds.forEach(k=>{k.x-=k.s*.3*dt;if(k.x<-60){k.x=W+40;k.y=40+Math.random()*160}});
  if(state==='ready'){bird.y=220+Math.sin(t/12)*8;gx=(gx+sp*dt)%24;return}
  if(state==='over'){bird.v+=.5*dt;bird.y=Math.min(bird.y+bird.v*dt,H-GH-10);bird.rot=Math.min(bird.rot+.08*dt,1.4);if(shake>0)shake-=.6*dt;return}
  gx=(gx+sp*dt)%24;bird.v+=.36*dt;bird.y+=bird.v*dt;bird.rot=Math.max(-.45,Math.min(1.2,bird.v/9));
  const lp=pipes[pipes.length-1];
  if(!lp||lp.x<W-175)pipes.push({x:W,top:50+Math.random()*(H-GH-gap-100),gap,done:false});
  pipes.forEach(p=>p.x-=sp*dt);pipes=pipes.filter(p=>p.x>-70);
  for(const p of pipes){
    if(!p.done&&p.x+52<70){p.done=true;score++;beep(880,.1,'triangle',1320)}
    if(70+11>p.x&&70-11<p.x+52&&(bird.y-11<p.top||bird.y+11>p.top+p.gap)){die();return}}
  if(bird.y+11>H-GH||bird.y<-20)die()}

function draw(){
  x.save();if(shake>0)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#4fb3e8');sky.addColorStop(1,'#bfeaf7');
  x.fillStyle=sky;x.fillRect(-10,-10,W+20,H+20);
  x.fillStyle='rgba(255,255,255,.85)';
  clouds.forEach(k=>{x.beginPath();x.arc(k.x,k.y,16*k.s,0,7);x.arc(k.x+18*k.s,k.y+4,13*k.s,0,7);x.arc(k.x-16*k.s,k.y+5,12*k.s,0,7);x.fill()});
  for(const p of pipes){
    x.save();x.translate(p.x,0);
    const g=x.createLinearGradient(0,0,52,0);g.addColorStop(0,'#6fdc55');g.addColorStop(.5,'#3f9d3a');g.addColorStop(1,'#2a7428');
    x.fillStyle=g;x.strokeStyle='#1f4f1d';x.lineWidth=2;
    x.fillRect(2,-2,48,p.top-14);x.fillRect(2,p.top+p.gap+14,48,H);
    x.fillRect(-2,p.top-16,56,16);x.strokeRect(-2,p.top-16,56,16);
    x.fillRect(-2,p.top+p.gap,56,16);x.strokeRect(-2,p.top+p.gap,56,16);x.restore()}
  x.fillStyle='#7bc043';x.fillRect(0,H-GH,W,10);
  x.fillStyle='#dcb96b';x.fillRect(0,H-GH+10,W,GH);
  x.fillStyle='#c9a35a';for(let i=-1;i<W/24+1;i++)x.fillRect(i*24-gx,H-GH+10,12,GH);
  x.save();x.translate(70,bird.y);x.rotate(bird.rot);
  x.fillStyle='#ffd23f';x.strokeStyle='#8a5a00';x.lineWidth=1.5;
  x.beginPath();x.ellipse(0,0,14,11,0,0,7);x.fill();x.stroke();
  const w=state==='over'?.6:Math.sin(t*.6)*7;
  x.fillStyle='#f5a623';x.beginPath();x.ellipse(-4,3,7,4+Math.abs(w)*.3,-.3+w*.05,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(6,-4,4.5,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(7.5,-4,2,0,7);x.fill();
  x.fillStyle='#ff6b2e';x.beginPath();x.moveTo(11,-1);x.lineTo(22,2);x.lineTo(11,6);x.fill();
  x.restore();
  if(state!=='ready'||true){x.fillStyle='#fff';x.strokeStyle='#1d2b36';x.lineWidth=5;x.lineJoin='round';x.font='bold 46px system-ui';x.textAlign='center';
    if(state!=='over'){x.strokeText(score,W/2,72);x.fillText(score,W/2,72)}}
  x.restore()}

function loop(now){
  const dt=Math.min((now-last)/16.667,3);last=now;t+=dt;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('pointerdown',e=>{if(e.target===snd)return;e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});
snd.addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;snd.textContent=muted?'🔇':'🔊';try{localStorage.setItem('fb2_mute',muted?'1':'0')}catch(_){}});
if('serviceWorker' in navigator){addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js')}catch(e){}})}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
